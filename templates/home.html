<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hostel Dashboard</title>

    <!-- PWA Support -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

    <meta name="theme-color" content="#0d6efd">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Hostel Dashboard">

    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: #0d6efd;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin: 0 0 10px;
            color: #333;
        }

        .card p {
            margin: 0;
            color: #666;
        }

        .logo {
            width: 100px;
            display: block;
            margin: 20px auto;
        }
    </style>
</head>

<body>

    <div class="header">
        Hostel Dashboard
    </div>

    <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

    <div class="container">

        <div class="card">
            <h2>Boarder Manager</h2>
            <p>Manage all hostel boarders easily.</p>
        </div>

        <div class="card">
            <h2>Attendance</h2>
            <p>Track daily attendance records.</p>
        </div>

        <div class="card">
            <h2>Vacant Rooms</h2>
            <p>Check available hostel rooms instantly.</p>
        </div>

    </div>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/static/service-worker.js')
            .then(function(registration) {
                console.log('ServiceWorker registered:', registration.scope);
            })
            .catch(function(error) {
                console.log('ServiceWorker registration failed:', error);
            });
        });
    }
    </script>

</body>
</html>
