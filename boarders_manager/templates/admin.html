<!DOCTYPE html>
<html>

<head>

<title>Admin Upload</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:#f2f6ff;
padding:20px;
}

.container{
max-width:400px;
margin:auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
color:#003366;
}

input,button{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
background:#007BFF;
color:white;
border:none;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

.back{
display:block;
margin-top:15px;
text-align:center;
text-decoration:none;
color:#003366;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>Upload New Excel File</h2>

<form action="/boarders/upload" method="POST" enctype="multipart/form-data">

<label>Password</label>
<input type="password" name="password" required>

<label>Select Excel File</label>
<input type="file" name="file" required>

<button type="submit">Upload Excel</button>

</form>

<a class="back" href="/boarders">← Back to Dashboard</a>

</div>

</body>
</html>
